<title>Уровень 6 · Всё работает, хочу больше</title>
<link rel="stylesheet" href="_deck.css">
<style>
  .rep{display:flex;gap:40px;align-items:center;justify-content:center;max-width:1080px;margin:0 auto;}
  .rep .src{border:3px solid var(--ink);background:#fff;padding:24px 26px;text-align:left;min-width:280px;}
  .rep .src .n{font-size:19px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:800;}
  .rep .src .h{font-size:30px;font-weight:800;margin-top:8px;}
  .rep .arrow{font-size:44px;color:var(--line);}
  .rep .outs{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;flex:1;}
  .rep .o{border:2px dashed var(--line);padding:14px 16px;font-size:23px;color:#b3aaa4;cursor:pointer;transition:.2s;text-align:left;}
  .rep .o.on{border-style:solid;border-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:700;}
  .rep-total{margin-top:28px;font-size:32px;}
  .rep-total b{font-size:56px;color:var(--accent);}
  .paths{display:flex;gap:24px;max-width:1080px;margin:0 auto;}
  .path{flex:1;border:2px solid var(--line);background:#fff;padding:26px 24px;text-align:left;}
  .path h4{margin:0 0 12px;font-size:30px;}
  .path .who{font-size:21px;color:var(--accent);font-weight:800;text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px;}
  .path p{margin:0;font-size:23px;color:var(--muted);line-height:1.4;}
  .team{display:flex;gap:20px;max-width:1180px;margin:0 auto;align-items:flex-start;}
  .team .role{flex:1;border:2px solid var(--line);background:#fff;padding:22px 22px 18px;text-align:left;cursor:pointer;transition:.2s;}
  .team .role.on{border-color:var(--accent);background:var(--accent-soft);}
  .team .num{font-size:19px;letter-spacing:.16em;color:var(--accent);font-weight:800;}
  .team .role h4{margin:6px 0 0;font-size:32px;}
  .team .body{max-height:0;overflow:hidden;opacity:0;transition:.25s;font-size:21px;color:var(--muted);line-height:1.45;}
  .team .role.on .body{max-height:400px;opacity:1;margin-top:12px;}
  .team .hrs{margin-top:14px;font-size:24px;font-weight:800;color:#b3aaa4;}
  .team .role.on .hrs{color:var(--accent);}
  .team-total{margin-top:28px;font-size:32px;}
  .team-total b{font-size:56px;color:var(--accent);}
</style>
</head>
<body>
<div id="fit"><div id="stage">
  <div id="pbar"></div>
  <div id="deck"></div>
  <div id="ctrl">
    <div class="ab" data-dir="-1">‹</div>
    <div class="ab" data-dir="1">›</div>
    <div class="ab" id="fsbtn" title="весь экран (F)">⛶</div>
    <span id="cnt">01 / 01</span>
    <span id="hint">F — весь экран · ← → листать · V — кадр камеры · N — заметки · T — суфлёр · R — полный текст</span>
  </div>
</div></div>

<script src="say/08.js"></script>
<script src="full/08.js"></script>
<script src="_deck.js"></script>
<script>
const SLIDES = [
  {k:'cover', t:'Уровень 6<br>Всё работает,<br>хочу больше', sub:'задача: масштабировать, а не удваивать нагрузку'},

  {k:'st', t:'контент выходит, не бесит,<br>не жрёт весь день и даёт отклик', sm:true,
   sub:'появился первый устойчивый результат'},
  {k:'st', t:'и вместе с ним появляется мысль', sub:'«а что если делать этого в два раза больше»', dark:true},

  {k:'sec', n:'опасность', t:'масштаб читают<br>как объём'},
  {k:'list', kicker:'как это выглядит', t:'',
   items:['работало пять роликов в неделю — давайте пятнадцать',
          'работал инстаграм — давайте ещё телеграм, ютуб, тикток и тредс одновременно',
          'через три недели человек выгорает и откатывается на третий уровень']},
  {k:'st', t:'масштаб — это не больше усилий', sm:true,
   sub:'это больше результата с тех же усилий'},

  {k:'sec', n:'шаг 0', t:'а есть ли что<br>масштабировать'},
  {k:'st', t:'нужен хотя бы один канал,<br>который стабильно даёт результат', sm:true,
   sub:'не «один ролик залетел», а работающая система: вы понимаете, что делаете и почему это откликается'},
  {k:'st', t:'масштабировать то, что не работает,<br>— это умножать ноль', sm:true},

  {k:'sec', n:'шаг 1', t:'два пути роста —<br>выберите свой'},
  {k:'ix', kicker:'подкаст Тимочко и Пырикова', t:'оба подхода работают, но не одинаково',
   html:`<div class="paths">
      <div class="path"><div class="who">1,1 млн подписчиков</div><h4>Через блог, шоу и охваты</h4>
        <p>супер-блогер, запуски на 160 млн рублей. работает, когда у вас уже есть аудитория и капитал на рекламу</p></div>
      <div class="path" style="border-color:#e8590c;background:#fff1e8"><div class="who">120 тысяч подписчиков</div>
        <h4>Через эффективность, структуру и точечные касания</h4>
        <p>рекордсмен геткурса, запуски на 200 млн. гораздо лучше, когда активов нет: каждая подписка на вес золота</p></div>
    </div>`,
   hint:'если человек с 16 тысячами делает запуск на 60 млн — значит и вы можете свой миллион на тысяче подписчиков'},

  {k:'sec', n:'шаг 2', t:'новый контент делают те,<br>у кого старый плохой'},
  {k:'st', t:'фраза не моя, это Виталий Говорухин', sm:true, sub:'но я её украл, потому что она бьёт точно'},
  {k:'list', kicker:'что делать', t:'',
   items:['собрать файл со ссылками на свои лучшие единицы',
          'чтобы под рукой всегда был контент, который можно перезалить',
          'люди не помнят, что смотрели вчера',
          'одну идею вообще нужно рассказать 5–7 раз, чтобы она прижилась']},
  {k:'st', t:'сначала смотрим, что уже есть,<br>потом создаём новое', sm:true, dark:true},

  {k:'sec', n:'шаг 3', t:'одна начинка —<br>разные формы'},
  {k:'ix', kicker:'соберите свою переупаковку', t:'кликайте на формы, в которые это можно превратить',
   html:`<div class="rep">
      <div class="src"><div class="n">исходник</div><div class="h">Один рабочий<br>созвон</div></div>
      <div class="arrow">→</div>
      <div class="outs" id="outs">
        <div class="o" data-w="1">длинное видео на YouTube</div>
        <div class="o" data-w="3">3 нарезки в Reels</div>
        <div class="o" data-w="3">3 шортса на YouTube</div>
        <div class="o" data-w="1">пост в телеграм</div>
        <div class="o" data-w="2">2 карусели</div>
        <div class="o" data-w="4">4 тредса</div>
      </div>
    </div>
    <div class="rep-total" id="reptot">из одной записи получается <b>0</b> единиц контента</div>`,
   hint:'вы уже собрали смысл, нашли пруф и упаковали его. второй раз эту работу делать не нужно',
   init(root){
     const tot=root.querySelector('#reptot');
     function upd(){
       let n=0; root.querySelectorAll('.o.on').forEach(o=>n+=Number(o.dataset.w));
       tot.innerHTML='из одной записи получается <b>'+n+'</b> единиц контента';
     }
     root.querySelectorAll('.o').forEach(o=>o.addEventListener('click',()=>{o.classList.toggle('on');upd();}));
   }},
  {k:'list', kicker:'мой апрель', t:'я ни разу не создавал контент',
   items:['не писал сценарии, не собирал контент-план, не организовывал съёмки',
          'только писал в телеграм по двадцать минут в день',
          'итог: 200 000 охватов, 45 000 аккаунтов, 30% новой аудитории',
          'это 15 000 человек, которые увидели меня']},
  {k:'st', t:'и это были нарезки созвонов с клиентами', sm:true,
   sub:'то есть такой контент по умолчанию продающий: вы не переупаковываете пользу, вы показываете свою работу'},

  {k:'sec', n:'шаг 4', t:'куда расширяться'},
  {k:'st', t:'есть площадки с органикой на новых людей,<br>а есть без неё', sm:true},
  {k:'table', kicker:'форма → площадка', t:'',
   head:['Ваша форма','Куда идти','Органика','Что учесть'],
   rows:[
     ['Короткое видео','Reels, TikTok, Shorts','+есть','одна съёмка — три площадки'],
     ['Длинное видео','YouTube','+есть','долго разгоняется, зато живёт годами'],
     ['Короткий текст','Threads','+есть','30 секунд на пост, площадку пушат'],
     ['Длинный текст','Telegram','-нет','удерживает, но сам не приводит'],
     ['Визуал, схемы','Карусели в Instagram','+есть','собираются быстрее видео'],
     ['Любая','Дзен, RuTube, ВК Клипы','-кейсов не видел','пуш есть, роста не встречал']
   ]},
  {k:'st', t:'одна новая площадка за раз', sub:'раскачали одну, получили результат — только потом следующая', dark:true},
  {k:'quote', kicker:'Threads · как это сработало у меня',
   t:['за полгода заметил три вещи:',
      'комментируешь других — охваты растут',
      'делаешь репост в сторис — большой охват на сторис',
      'набирающий тредс рекомендуется в ленте инстаграма',
      'а ещё оттуда пришёл клиент — Женя, тренер по бегу'],
   sub:'путь простой: привлечение → влюбление → авторитет. за первый месяц добавили к его доходу 1 200 долларов'},
  {k:'quote', kicker:'про терпение',
   t:['2013 — начали выкладывать на ютуб, когда никто не вёл соцсети',
      '2016 — влоги, когда это ещё не было популярным',
      '2019 — тикток, когда площадку считали детской',
      '2021 — короткая коммерческая реклама',
      'и каждый раз мы это бросали, потому что не видели подтверждений'],
   sub:'заход на новую площадку почти всегда выглядит глупо в первые месяцы'},

  {k:'sec', n:'шаг 5', t:'монетизация —<br>следующий этап'},
  {k:'st', t:'дальше своими руками вы не вытянете', sm:true,
   sub:'чтобы расти, нужны будут другие люди — те, кто развяжет вам руки'},
  {k:'st', t:'а другим людям надо платить', sm:true,
   sub:'пока контент не приносит денег, команду собирать не на что. потолок остаётся там же, где был'},
  {k:'st', t:'здесь вы переходите в статус<br>небольшого предпринимателя', sm:true, dark:true,
   sub:'уже не просто автор, который делает контент: появляются люди, обязательства перед ними и расходы, которые надо отбивать'},

  {k:'sec', n:'шаг 6', t:'команда'},
  {k:'cards', kicker:'разница с четвёртым уровнем', t:'',
   cards:[{h:'На четвёртом',p:'команда нужна была, чтобы вернуть себе время'},
          {h:'На шестом',p:'команда нужна, чтобы масштаб вообще стал возможен. своими руками вы упрётесь в потолок'}]},
  {k:'ix', kicker:'кого берём и в каком порядке', t:'кликайте по ролям — смотрите, сколько часов возвращается',
   html:`<div class="team">
      <div class="role" data-h="7">
        <div class="num">1</div><h4>Монтажёр</h4>
        <div class="body">монтаж одного ролика — час-два, а рилс каждый день.<br>
          рынок: 20–40 долларов за короткий ролик, за пакет дают скидку.<br>
          с Максом работаем больше полутора лет, первые 2–3 месяца ушли на процесс</div>
        <div class="hrs">+7 часов в неделю</div>
      </div>
      <div class="role" data-h="6">
        <div class="num">2</div><h4>Ассистент</h4>
        <div class="body">залить рилс, выложить пост, выдать материалы клиентам,
          закинуть контент в платное сообщество, найти подрядчика и вести с ним переписку.<br>
          первого я уволил — это нормально, был шорт-лист</div>
        <div class="hrs">+6 часов в неделю</div>
      </div>
      <div class="role" data-h="0">
        <div class="num">3</div><h4>Технический специалист</h4>
        <div class="body">воронка, лендинг, бот, подключить оплату.<br>
          не человек на постоянку — задачи под конкретный запуск</div>
        <div class="hrs">точечно, под запуск</div>
      </div>
    </div>
    <div class="team-total" id="teamtot">возвращается <b>0</b> часов в неделю</div>`,
   hint:'я не могу купить себе новое время. но я могу купить время другого человека',
   init(root){
     const tot=root.querySelector('#teamtot');
     root.querySelectorAll('.role').forEach(r=>r.addEventListener('click',()=>{
       r.classList.toggle('on');
       let n=0; root.querySelectorAll('.role.on').forEach(x=>n+=Number(x.dataset.h));
       tot.innerHTML='возвращается <b>'+n+'</b> часов в неделю'
         + (n>=13 ? ' — почти два рабочих дня' : '');
     }));
   }},
  {k:'list', kicker:'давайте посчитаем математику', t:'ассистент',
   items:['залить рилс — 10 минут, пост в телеграм — 5, выдать материалы — 10, залить в сообщество — 10',
          '30 минут в день превращаются в 3 часа на неделе',
          'сюда добавляем поиск подрядчиков и переписку с ними — выходит 6 часов',
          'снова целый рабочий день']},

  {k:'sec', n:'шаг 7', t:'платный трафик'},
  {k:'st', t:'про платный трафик скажу честно:<br>я не эксперт по закупу', sm:true,
   sub:'я разбираюсь в контенте, а контент — это и есть бесплатный трафик'},
  {k:'st', t:'подключать, когда монетизация уже настроена', sm:true,
   sub:'иначе платный трафик просто быстрее покажет, что система не работает. дороже и обиднее'},

  {k:'sec', n:'осторожно', t:'антипаттерны<br>уровня'},
  {k:'list', kicker:'что вернёт вас назад', t:'',
   items:['«надо просто больше выкладывать» — прямая дорога на третий уровень',
          'лить сразу на все площадки — не раскачаете ни одной',
          'мыслить масштабом вместо действий — если контент перестал выходить, вы не масштабируетесь, а фантазируете',
          'ждать, что масштаб отменит откаты — не отменит']},

  {k:'sec', n:'итог', t:'задача уровня'},
  {k:'list', kicker:'делаем руками', t:'', numbered:true,
   items:['собрать файл со ссылками на свои лучшие единицы — минимум десять',
          'взять три из них и переупаковать в другую форму. ничего нового не придумывая',
          'выбрать ОДНУ новую площадку с органикой',
          'ответить, какой из двух путей роста ваш']},
  {k:'st', t:'маркер: вы перестали спрашивать<br>«что бы ещё создать»', sm:true,
   sub:'и начали спрашивать «что из того, что уже сработало, ещё не отработало на полную»', dark:true},
];
Deck.build(SLIDES);
</script>
