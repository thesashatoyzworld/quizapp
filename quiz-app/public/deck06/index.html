<style>
  /* четыре формата, с которых всё начиналось */
  .fmts{display:flex;gap:14px;justify-content:center;max-width:940px;margin:0 auto;}
  .fmt{flex:1 1 0;display:flex;flex-direction:column;gap:10px;}
  .fmt img{width:100%;height:auto;display:block;border:2px solid var(--ink);}
  .fmt .cap{font-size:18px;text-transform:uppercase;letter-spacing:.07em;font-weight:800;
    color:var(--muted);text-align:center;line-height:1.25;min-height:2.6em;}
  .fmt-note{margin-top:26px;font-size:24px;color:var(--muted);}
  .fmts.shots .fmt img{height:330px;object-fit:contain;object-position:top;background:#fff;}
  /* венн: хочу я × хотят они */
  .venn{max-width:900px;margin:0 auto;}
  .venn svg{width:100%;height:auto;display:block;}
  .venn-caps{display:flex;gap:40px;justify-content:center;margin-top:10px;}
  .venn-caps .vc{flex:1;font-size:22px;line-height:1.35;color:var(--muted);}
  .venn-caps .vc b{color:var(--ink);}
  .cat{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:1080px;margin:0 auto;text-align:left;}
  .cat .c{border:2px solid var(--line);padding:18px 20px;background:#fff;}
  .cat .c.bad{border-color:#e5c3c3;background:#fff6f6;}
  .cat .c.good{border-color:var(--ok);background:#f4fbf5;}
  .cat .c h4{margin:0 0 8px;font-size:24px;}
  .cat .c .ex{font-size:20px;color:var(--muted);line-height:1.35;}
  .cat .c .verdict{font-size:18px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;margin-top:10px;}
  .cat .c.bad .verdict{color:var(--bad);}
  .cat .c.good .verdict{color:var(--ok);}
</style>
