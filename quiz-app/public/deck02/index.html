<title>Уровень 1 · Хочу, но не делаю</title>
<link rel="stylesheet" href="_deck.css">
<style>
  .locks{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:1050px;margin:0 auto;}
  .lock{border:2px solid var(--line);background:#fff;padding:22px 20px;cursor:pointer;transition:.15s;text-align:left;}
  .lock:hover{border-color:var(--accent);}
  .lock.on{border-color:var(--accent);background:var(--accent-soft);}
  .lock .ic{font-size:34px;line-height:1;}
  .lock .nm{font-size:26px;font-weight:700;margin-top:10px;}
  .lockout{margin-top:26px;border-top:2px solid var(--ink);padding-top:22px;text-align:left;max-width:1050px;
    margin-left:auto;margin-right:auto;min-height:170px;}
  .lockout .h{font-size:30px;font-weight:800;margin-bottom:10px;}
  .lockout .k{font-size:22px;color:var(--accent);text-transform:uppercase;letter-spacing:.14em;font-weight:800;margin:16px 0 8px;}
  .lockout .p{font-size:25px;line-height:1.4;color:var(--muted);}
  .lockout .p b{color:var(--ink);}

  /* цикл синдрома самозванца */
  .cyc{display:flex;align-items:stretch;justify-content:center;gap:6px;flex-wrap:nowrap;margin:0 auto;}
  .cyc .st6{border:2px solid var(--line);background:#fff;padding:16px 14px;flex:0 0 192px;min-height:200px;
    display:flex;flex-direction:column;justify-content:center;opacity:.28;transition:.25s;text-align:left;}
  .cyc .st6.on{opacity:1;border-color:var(--accent);background:var(--accent-soft);}
  .cyc .st6 .n{font-size:18px;font-weight:800;color:var(--accent);letter-spacing:.1em;}
  .cyc .st6 .x{font-size:22px;line-height:1.3;font-weight:700;margin-top:8px;}
  .cyc .ar{font-size:26px;color:var(--muted);opacity:.5;align-self:center;flex:0 0 auto;}
  .cycbtn{margin-top:30px;}
  .cycbtn button{font:inherit;font-size:24px;font-weight:700;padding:13px 30px;border:2px solid var(--ink);
    background:var(--ink);color:#fff;cursor:pointer;}
  .cycbtn button:hover{background:var(--accent);border-color:var(--accent);}
  .cycnote{margin-top:22px;font-size:26px;color:var(--accent);font-weight:700;min-height:36px;}

  /* спортзал: три захода на весы */
  .gym{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;max-width:1150px;margin:0 auto;}
  .gym .g{border:2px solid var(--line);background:#fff;padding:26px 22px;}
  .gym .g .w{font-size:22px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:800;}
  .gym .g .r{font-size:34px;font-weight:800;margin-top:14px;color:var(--accent);}

  /* шкала уровней: где вы на самом деле / где себя видите / куда прыгаете */
  .xp{display:flex;align-items:center;justify-content:center;gap:40px;max-width:1320px;margin:0 auto;}
  .xp .xpwrap{position:relative;flex:0 0 700px;height:400px;}
  .xp .bars{position:absolute;inset:0;display:flex;align-items:flex-end;gap:5px;}
  .xp .bars i{flex:1;background:var(--line);opacity:.5;transition:.35s;}
  .xp .bars i.lit{background:var(--accent);opacity:.3;}
  .xp .mk{position:absolute;transform:translateX(-50%);text-align:center;opacity:0;transition:.45s;}
  .xp .mk.on{opacity:1;}
  .xp .mk .dot{width:24px;height:24px;border-radius:50%;background:var(--accent);border:4px solid #fff;
    box-shadow:0 0 0 2px var(--accent);margin:0 auto;}
  .xp .mk .lb{font-size:21px;font-weight:800;margin-top:7px;white-space:nowrap;}
  .xp .mk.ghost{transform:translateX(-14px);text-align:left;}
  .xp .mk.ghost .dot{background:#fff;border-color:var(--muted);box-shadow:0 0 0 2px var(--muted);margin:0;}
  .xp .mk.ghost .lb{color:var(--muted);text-align:left;}
  .xp .jump{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:.45s;pointer-events:none;}
  .xp .jump.on{opacity:1;}
  .xp .jump.dead #xppath{stroke:var(--muted);opacity:.4;}
  .xp .jump.dead #xparrow path{fill:var(--muted);opacity:.4;}
  .xp .jump.dead #xpcross{opacity:1;}
  .xp #xpcross{opacity:0;transition:.45s;}
  .xp.blind .bars i{opacity:.16;}
  .xp.blind .mk:not(.ghost){opacity:0;}
  .xp .axis{position:absolute;left:0;right:0;bottom:-34px;display:flex;justify-content:space-between;
    font-size:19px;color:var(--muted);font-weight:700;}
  .xp .xpside{flex:1;text-align:left;}
  .xp .xph{font-size:34px;font-weight:800;line-height:1.25;min-height:88px;}
  .xp .xpn{font-size:25px;line-height:1.4;color:var(--muted);margin-top:14px;min-height:140px;}
  .xp .btn{margin-top:22px;font:inherit;font-size:24px;font-weight:700;padding:13px 30px;
    border:2px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;}
  .xp .btn:hover{background:var(--accent);border-color:var(--accent);}

  /* поток: точка ходит по диаграмме */
  .flow{display:flex;align-items:center;justify-content:center;gap:44px;max-width:1300px;margin:0 auto;}
  .flow .fwrap{position:relative;flex:0 0 640px;}
  .flow .fwrap img{width:100%;display:block;}
  .flow .fdot{position:absolute;width:30px;height:30px;border-radius:50%;background:var(--accent);
    border:4px solid #fff;box-shadow:0 0 0 2px var(--accent);transform:translate(-50%,-50%);
    transition:left .55s cubic-bezier(.4,0,.2,1), top .55s cubic-bezier(.4,0,.2,1);}
  .flow .fside{flex:1;text-align:left;}
  .flow .fstep{font-size:34px;font-weight:800;line-height:1.25;min-height:130px;}
  .flow .fnote{font-size:26px;line-height:1.4;color:var(--muted);margin-top:16px;min-height:110px;}
  .flow .btn{margin-top:26px;font:inherit;font-size:24px;font-weight:700;padding:13px 30px;
    border:2px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;}
  .flow .btn:hover{background:var(--accent);border-color:var(--accent);}
</style>
</head>
<body>

<script>

   how:'<b>снимайте в галерею</b>, никуда не выкладывая · и <b>заведите новый аккаунт</b>, где вас никто не знает'},
  {ic:'📉', nm:'Страх неудачи', why:'вы пришли в спортзал и после первого упражнения встали на весы. ничего не изменилось — разочарование',
   how:'<b>смените критерий</b>: выложил единицу = победа. результат привычки — её повторение, а не цифры'},
  {ic:'💎', nm:'Перфекционизм', why:'скрытая форма страха. планка настолько высокая, что вызывает стресс, а стресс жрёт время и энергию, которых нет',
   how:'<b>один дубль</b> — не переснимать вообще · <b>потолок времени вместо потолка качества</b>: выкладываете то, что получилось, когда время вышло'},
  {ic:'🎭', nm:'Синдром самозванца', why:'«я недостаточно хорош» → надо стараться → слишком тяжело → оправдание → бездействие → «я недостаточно хорош». цикл замкнулся',
   how:'<b>принять текущий уровень</b> · <b>инвентаризация опыта</b> — выписать свои кейсы · <b>признание другим человеком</b>'},
  {ic:'👑', nm:'Эго', why:'«это слишком просто». эго хочет выстрадать результат, иначе он ничего не стоит. с этим чаще всего сталкиваются творцы',
   how:'<b>разделите контент и свою потребность</b>. быть уникальным — в продукте. контент — просто инструмент привлечения внимания'},

   how:'<b>вернуться к цепочке «зачем»</b> в блоке про цель · и честно: часть вещей решается только <b>с психотерапевтом</b>'}
];

const CYCLE = [
  {n:'1', x:'«я недостаточно хорош, компетентен, квалифицирован»'},
  {n:'2', x:'значит надо стараться, работать, делать лучше'},
  {n:'3', x:'это слишком сложно и тяжело'},
  {n:'4', x:'«мне это не подходит, у меня нет времени и энергии»'},
  {n:'5', x:'я ничего не делаю'},
];

const SLIDES = [
  {k:'cover', t:'Уровень 1<br>Хочу, но не делаю', sub:'задача: просто начать выкладывать'},

  {k:'list', kicker:'это вы, если', t:'',
   items:['давно смотрите на других и хотите начать',
          'может даже покупали какие-то обучения',
          'но ничего не делаете. или попробовали и разочаровались',
          'или поняли, что это сложнее, чем казалось']},
  {k:'st', t:'здесь мы разберём одну простую вещь', sm:true, sub:'что вам мешает просто начать'},
  {k:'ix', kicker:'результат уровня', t:'вы какое-то время выкладываете контент',
   html:`<div style="max-width:1120px;margin:0 auto">
     <img src="assets/l1-do-posle.png" alt="" style="width:100%;display:block;border-radius:4px">
     <div style="display:flex;margin-top:16px">
       <div class="kicker" style="flex:1;margin:0">до</div>
       <div class="kicker" style="flex:1;margin:0">после</div>
     </div>
   </div>`,
   todo:'читка: плевать какой контент, плевать какие цифры'},
  {k:'st', t:'уровень пройден, когда кнопка «опубликовать»<br>перестала быть страшной', sm:true,
   sub:'а выложенная единица начала ощущаться как победа'},

  {k:'sec', n:'разбор', t:'шесть замков<br>на двери'},
  {k:'car', kicker:'как это выглядит целиком', t:'',
   items:[
     {src:'assets/ohrannik-1.png', h:'дверь «соц. сети»',
      p:'между вами и кнопкой стоит охрана. связка ключей у неё на поясе, не у вас'},
     {src:'assets/ohrannik-2.png', h:'шесть замков',
      p:'страх осуждения · страх неудачи · перфекционизм · синдром самозванца · эго · нет мотивации'},
     {src:'assets/ohrannik-3.png', h:'новый аккаунт',
      p:'дверь не ломаем. идём туда, где на вас никто не смотрит'},
     {src:'assets/ohrannik-4.png', h:'лаборатория нового контента',
      p:'выкладываете единицу за единицей. охрана стоит рядом и записывает'},
     {src:'assets/ohrannik-5.png', h:'блокнот охраны',
      p:'не больно. не страшно. всем похуй'},
     {src:'assets/ohrannik-6.png', h:'открыто',
      p:'замки снимает он сам, потому что собрал доказательства. и остаётся рядом, просто больше не мешает'},
   ]},
  {k:'ix', kicker:'кликните на любой', t:'что именно вас держит',
   html:`<div class="locks" id="locks">${LOCKS.map((l,i)=>
      `<div class="lock" data-i="${i}"><div class="ic">${l.ic}</div><div class="nm">${l.nm}</div></div>`).join('')}</div>
      <div class="lockout" id="lockout"><div class="p" style="opacity:.55">каждый замок открывается своим ключом — нажмите, чтобы посмотреть</div></div>`,
   hint:'обзор перед разбором: дальше каждый замок идёт отдельным блоком',
   init(root){
     const out=root.querySelector('#lockout');
     root.querySelectorAll('.lock').forEach(el=>{
       el.addEventListener('click',()=>{
         root.querySelectorAll('.lock').forEach(x=>x.classList.remove('on'));
         el.classList.add('on');
         const l=LOCKS[Number(el.dataset.i)];
         out.innerHTML=`<div class="h">${l.ic} ${l.nm}</div>
           <div class="k">что за этим стоит</div><div class="p">${l.why}</div>
           <div class="k">как обойти</div><div class="p">${l.how}</div>`;
       });
     });
   }},

  {k:'st', t:'заставлять себя и подключать силу воли<br>смысла нет', sm:true,
   sub:'психика защищает вас, и она сильнее. поэтому систему безопасности мы обходим, а не ломаем'},
  {k:'img', kicker:'почему сила воли тут не работает', t:'',
   src:'assets/potok.png', h:780,
   cap:'по горизонтали ваш навык, по вертикали сложность задачи, которую вы себе поставили'},

  {k:'ix', kicker:'чем вы управляете прямо сейчас', t:'',
   html:`<div class="flow" id="flow">
     <div class="fwrap">
       <img src="assets/potok.png" alt="">
       <div class="fdot" id="fdot"></div>
     </div>
     <div class="fside">
       <div class="fstep" id="fstep">снять ролик со сценарием, светом и монтажом</div>
       <div class="fnote" id="fnote">при вашем навыке это тревога. отсюда вы и не начинаете</div>
       <button class="btn" id="fgo">дальше →</button>
     </div>
   </div>`,
   init(root){
     // x — навык (растёт месяцами), y — планка (двигается сегодня)
     const STEPS=[
       {x:33,y:24,t:'снять ролик со сценарием, светом и монтажом',
        n:'при вашем навыке это тревога. отсюда вы и не начинаете'},
       {x:29,y:64,t:'снять то же самое на телефон одним дублем',
        n:'тот же вы, та же камера. опустили планку — попали в поток'},
       {x:62,y:72,t:'прошло два месяца, вы снимаете это на автомате',
        n:'навык уехал вправо, и та же задача стала скучной'},
       {x:66,y:40,t:'добавляете сложность: свет, монтаж, сценарий',
        n:'снова поток. так и идёте по диагонали, из уровня в уровень'},
     ];
     const dot=root.querySelector('#fdot'), st=root.querySelector('#fstep'),
           nt=root.querySelector('#fnote'), btn=root.querySelector('#fgo');
     let i=0;
     const show=k=>{ const s=STEPS[k];
       dot.style.left=s.x+'%'; dot.style.top=s.y+'%';
       st.textContent=s.t; nt.textContent=s.n;
       btn.textContent = k===STEPS.length-1 ? '↻ сначала' : 'дальше →'; };
     btn.addEventListener('click',()=>{ i=(i+1)%STEPS.length; show(i); });
     show(0);
   }},

  {k:'st', t:'навык двигается вправо месяцами.<br>планка опускается сегодня', sm:true,
   sub:'поэтому на первом уровне мы работаем не с навыком, а с планкой'},

  {k:'st', t:'если начать с насилия над собой', xs:true,
   sub:'у вас сформируется негативное отношение к контенту, и каждая публикация будет вызывать боль'},
  {k:'st', t:'у нас два варианта', sm:true,
   sub:'либо разбираемся в вопросе, либо создаём себе комфортные условия. либо всё вместе'},

  /* ── ЗАМОК 1 ───────────────────────────────────────────────── */
  {k:'sec', n:'замок 1', t:'страх осуждения'},
  {k:'img', kicker:'мозг оценивает это как выход к трибуналу', t:'',
   src:'assets/zamok-1.png', h:640,
   cap:'тени показывают пальцами только в вашей голове. живые люди рядом идут мимо, уткнувшись в свои экраны'},
  {k:'st', t:'«что подумают мои друзья,<br>родственники, коллеги?»', sm:true,

  {k:'st', t:'зажимает настолько, что мозг придумывает<br>миллион оправданий, лишь бы этого не делать', xs:true,
   sub:'оно и понятно: наша психика защищает нас'},
  {k:'st', t:'мы как вид выжили потому,<br>что научились собираться в группы', sm:true,

   sub:'а это всегда заканчивается плохо. поэтому предлагаю эту систему обойти'},

  {k:'sec', n:'обход системы', t:'два шага'},
  {k:'list', kicker:'шаг первый', t:'включай камеру и снимай себя',

  {k:'st', t:'когда ты привыкнешь к себе в кадре<br>и перестанешь смущаться', xs:true,
   sub:'а это произойдёт, и ты это почувствуешь — переходим к следующему шагу'},
  {k:'quote', kicker:'от себя', t:['я сам постоянно разговариваю на камеру: когда мне грустно, страшно, я устал, хочу поныть, высказаться',

  {k:'list', kicker:'шаг второй', t:'новый аккаунт и публикация',

  /* ── ЗАМОК 2 ───────────────────────────────────────────────── */
  {k:'sec', n:'замок 2', t:'страх неудачи'},
  {k:'img', kicker:'результата ждут после первого подхода', t:'',
   src:'assets/zamok-2.png', h:640,
   cap:'одно отжимание — и сразу в зеркало: почему я ещё не такой'},
  {k:'st', t:'все мы хотим видеть крутые цифры.<br>это нормально', sm:true,
   sub:'но если привычка и навык не сформированы — это завышенные ожидания'},
  {k:'st', t:'«а что если я выложу рилс<br>и он не наберёт просмотров?»', sm:true,
   sub:'звучит голос в голове. давление слишком большое — и начинается саботаж'},
  {k:'ix', kicker:'разбираемся в вопросе', t:'вы пришли в спортзал и встали на весы',
   html:`<div class="gym">
