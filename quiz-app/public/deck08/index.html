<style>
  .rep{display:flex;gap:40px;align-items:center;justify-content:center;max-width:1080px;margin:0 auto;}
  .rep .src{border:3px solid var(--ink);background:#fff;padding:24px 26px;text-align:left;min-width:280px;}
  .rep .src .n{font-size:19px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:800;}
  .rep .src .h{font-size:30px;font-weight:800;margin-top:8px;}
  .rep .arrow{font-size:44px;color:var(--line);}
  .rep .outs{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;flex:1;}
  .rep .o{border:2px dashed var(--line);padding:14px 16px;font-size:23px;color:#b3aaa4;cursor:pointer;transition:.2s;text-align:left;}
  .rep .o.on{border-style:solid;border-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:700;}
  .rep-total{margin-top:28px;font-size:32px;}
  .rep-total b{font-size:56px;color:var(--accent);}
  .paths{display:flex;gap:24px;max-width:1080px;margin:0 auto;}
  .path{flex:1;border:2px solid var(--line);background:#fff;padding:26px 24px;text-align:left;}
  .path h4{margin:0 0 12px;font-size:30px;}
  .path .who{font-size:21px;color:var(--accent);font-weight:800;text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px;}
  .path p{margin:0;font-size:23px;color:var(--muted);line-height:1.4;}
  .team{display:flex;gap:20px;max-width:1180px;margin:0 auto;align-items:flex-start;}
  .team .role{flex:1;border:2px solid var(--line);background:#fff;padding:22px 22px 18px;text-align:left;cursor:pointer;transition:.2s;}
  .team .role.on{border-color:var(--accent);background:var(--accent-soft);}
  .team .num{font-size:19px;letter-spacing:.16em;color:var(--accent);font-weight:800;}
  .team .role h4{margin:6px 0 0;font-size:32px;}
  .team .body{max-height:0;overflow:hidden;opacity:0;transition:.25s;font-size:21px;color:var(--muted);line-height:1.45;}
  .team .role.on .body{max-height:400px;opacity:1;margin-top:12px;}
  .team .hrs{margin-top:14px;font-size:24px;font-weight:800;color:#b3aaa4;}
  .team .role.on .hrs{color:var(--accent);}
  .team-total{margin-top:28px;font-size:32px;}
  .team-total b{font-size:56px;color:var(--accent);}
  .hunt{max-width:1080px;margin:0 auto;}
  .hunt .steps{display:flex;flex-direction:column;gap:7px;}
  .hunt .hs{display:flex;align-items:center;gap:20px;border:2px solid var(--line);background:#fff;
    padding:12px 20px;text-align:left;cursor:pointer;transition:.2s;}
  .hunt .hs:nth-child(1){width:56%;margin-left:auto;margin-right:auto;}
  .hunt .hs:nth-child(2){width:66%;margin-left:auto;margin-right:auto;}
  .hunt .hs:nth-child(3){width:78%;margin-left:auto;margin-right:auto;}
  .hunt .hs:nth-child(4){width:89%;margin-left:auto;margin-right:auto;}
  .hunt .hs:nth-child(5){width:100%;}
  .hunt .hs.on{border-color:var(--accent);background:var(--accent-soft);}
  .hunt .hs .n{font-size:30px;font-weight:800;color:var(--accent);min-width:36px;}
  .hunt .hs .tx b{font-size:26px;display:block;line-height:1.15;}
  .hunt .hs .tx span{font-size:20px;color:var(--muted);}
  .hunt .hout{margin-top:24px;font-size:26px;min-height:64px;}
  .expand{max-width:1080px;margin:0 auto;}
  .expand .core{display:inline-block;border:3px solid var(--ink);background:var(--accent-soft);
    padding:16px 28px;font-size:30px;font-weight:800;line-height:1.2;}
  .expand .ways{display:flex;gap:22px;margin-top:22px;position:relative;}
  .expand .ways:before{content:"";position:absolute;top:-22px;left:25%;right:25%;height:22px;
    border-top:3px solid var(--accent);border-left:3px solid var(--accent);border-right:3px solid var(--accent);}
  .expand .w{flex:1;border:2px solid var(--line);background:#fff;padding:20px 22px;text-align:left;}
  .expand .w .n{font-size:19px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:800;}
  .expand .w h4{margin:8px 0 10px;font-size:30px;}
  .expand .w div{font-size:22px;color:var(--muted);line-height:1.4;}
  .expand .far{margin-top:20px;border-top:2px dashed var(--line);padding-top:14px;
    font-size:25px;font-weight:700;}
  .ofr{max-width:1000px;margin:0 auto;text-align:left;}
  .ofr .items{display:flex;flex-direction:column;gap:14px;margin-bottom:34px;}
  .ofr .it{display:flex;gap:20px;align-items:flex-start;border:2px solid var(--line);
    background:#fff;padding:18px 24px;font-size:29px;font-weight:600;line-height:1.25;}
  .ofr .it:before{content:"";flex:0 0 auto;width:26px;height:4px;background:var(--accent);margin-top:16px;}
  .ofr .price{border:3px solid var(--ink);background:var(--accent-soft);padding:24px 28px;
    display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;}
  .ofr .price .sum{font-size:52px;font-weight:800;color:var(--accent);}
  .ofr .price .minus{font-size:28px;font-weight:600;}
  .ofr .term{margin-top:20px;font-size:26px;color:var(--muted);}
  .reinv{max-width:1120px;margin:0 auto;}
  .reinv .ringwrap{display:inline-block;}
  .reinv .ring{display:flex;align-items:center;justify-content:center;gap:0;cursor:pointer;}
  .reinv .node{flex:0 0 190px;border:2px solid var(--line);background:#fff;padding:18px 10px;
    text-align:center;opacity:.25;transition:.25s;position:relative;}
  .reinv .node+.node{margin-left:44px;}
  .reinv .node+.node:before{content:"→";position:absolute;left:-38px;top:50%;transform:translateY(-50%);
    font-size:30px;color:var(--line);}
  .reinv .node.on{opacity:1;border-color:var(--accent);background:var(--accent-soft);}
  .reinv .node .ic{font-size:38px;line-height:1;}
  .reinv .node .lb{margin-top:8px;font-size:21px;font-weight:700;line-height:1.2;}
  .reinv .ring.closed .node:last-child{border-width:3px;}
  .reinv .loopline{display:block;width:100%;height:76px;opacity:0;transition:.3s;}
  .reinv.closed .loopline{opacity:1;}
  .reinv .legend{margin-top:6px;text-align:left;display:flex;flex-direction:column;gap:9px;min-height:210px;}
  .reinv .lg{font-size:23px;color:var(--muted);line-height:1.35;opacity:0;transition:.25s;}
  .reinv .lg.on{opacity:1;}
  .reinv .lg b{color:var(--accent);}
  .reinv .lg.loop{font-weight:700;color:var(--ink);border-top:2px solid var(--line);padding-top:10px;}
  .reinv .rnext{margin-top:16px;display:inline-block;border:2px solid var(--ink);background:var(--ink);
    color:#fff;padding:10px 20px;font-size:22px;font-weight:700;cursor:pointer;}
</style>

       <span class="minus">в месяц, минус то, что вы заплатили за этот курс</span>
     </div>
     <div class="term">предложение действует месяц с момента покупки курса</div>
   </div>`},
  {k:'ix', kicker:'что происходит с деньгами дальше', t:'кликайте — собираем круг',
   html:`<div class="reinv">
    <div class="ringwrap">
     <div class="ring">
       <div class="node" data-i="1"><div class="ic">🔋</div><div class="lb">энергия и время</div></div>
       <div class="node" data-i="2"><div class="ic">🧩</div><div class="lb">монетизация</div></div>
       <div class="node" data-i="3"><div class="ic">₽</div><div class="lb">деньги</div></div>
       <div class="node" data-i="4"><div class="ic">↺</div><div class="lb">обратно в блог</div></div>
     </div>
     <svg class="loopline" viewBox="0 0 1000 70" preserveAspectRatio="none" aria-hidden="true">
       <path d="M 893 0 L 893 46 L 106 46 L 106 14" fill="none" stroke="#e8590c" stroke-width="3"
             vector-effect="non-scaling-stroke"/>
       <path d="M 96 28 L 106 8 L 116 28" fill="none" stroke="#e8590c" stroke-width="3"
             vector-effect="non-scaling-stroke"/>
     </svg>
    </div>
     <div class="legend">
       <div class="lg" data-i="1"><b>1.</b> сначала вы вкладываете только своё — энергию и время. других ресурсов нет</div>
       <div class="lg" data-i="2"><b>2.</b> из этого вырастает монетизация: есть оффер, есть кому и что продавать</div>
       <div class="lg" data-i="3"><b>3.</b> блог начинает приносить деньги</div>
       <div class="lg" data-i="4"><b>4.</b> и вот теперь деньги можно вернуть обратно в блог: подрядчики, платный трафик, продакшн</div>
       <div class="lg loop" data-i="5">круг замкнулся — дальше он крутится сам, и каждый оборот вы уже вкладываете не только себя</div>
     </div>
     <div class="rnext">дальше →</div>
   </div>`,
   hint:'до этого момента вы были единственным вложением в свой блог',
   init(root){
     let step=0;
     const btn=root.querySelector('.rnext');
     function show(){
       root.querySelectorAll('.node').forEach(n=>n.classList.toggle('on',Number(n.dataset.i)<=step));
       root.querySelectorAll('.lg').forEach(l=>l.classList.toggle('on',Number(l.dataset.i)<=step));
       root.querySelector('.ring').classList.toggle('closed',step>=5);
       root.querySelector('.reinv').classList.toggle('closed',step>=5);
       btn.textContent = step>=5 ? '↻ сначала' : 'дальше →';
     }
     function next(){ step = step>=5 ? 0 : step+1; show(); }
     btn.addEventListener('click',next);
     root.querySelector('.ring').addEventListener('click',next);
     show();
   }},

  {k:'sec', n:'шаг 7', t:'команда'},
  {k:'cards', kicker:'разница с четвёртым уровнем', t:'',
   cards:[{h:'На четвёртом',p:'команда нужна была, чтобы вернуть себе время'},
          {h:'На шестом',p:'команда нужна, чтобы масштаб вообще стал возможен. своими руками вы упрётесь в потолок'}]},
  {k:'ix', kicker:'кого берём и в каком порядке', t:'кликайте по ролям — смотрите, сколько часов возвращается',
   html:`<div class="team">
      <div class="role" data-h="7">
        <div class="num">1</div><h4>Монтажёр</h4>
        <div class="body">монтаж одного ролика — час-два, а рилс каждый день.<br>
          рынок: 20–40 долларов за короткий ролик, за пакет дают скидку.<br>
          с Максом работаем больше полутора лет, первые 2–3 месяца ушли на процесс</div>
        <div class="hrs">+7 часов в неделю</div>
      </div>
      <div class="role" data-h="6">
        <div class="num">2</div><h4>Ассистент</h4>
        <div class="body">залить рилс, выложить пост, выдать материалы клиентам,
          закинуть контент в платное сообщество, найти подрядчика и вести с ним переписку.<br>
          первого я уволил — это нормально, был шорт-лист</div>
        <div class="hrs">+6 часов в неделю</div>
      </div>
      <div class="role" data-h="0">
        <div class="num">3</div><h4>Технический специалист</h4>
        <div class="body">воронка, лендинг, бот, подключить оплату.<br>
          не человек на постоянку — задачи под конкретный запуск</div>
        <div class="hrs">точечно, под запуск</div>
      </div>
    </div>
    <div class="team-total" id="teamtot">возвращается <b>0</b> часов в неделю</div>`,
   hint:'я не могу купить себе новое время. но я могу купить время другого человека',
   init(root){
     const tot=root.querySelector('#teamtot');
     root.querySelectorAll('.role').forEach(r=>r.addEventListener('click',()=>{
       r.classList.toggle('on');
       let n=0; root.querySelectorAll('.role.on').forEach(x=>n+=Number(x.dataset.h));
       tot.innerHTML='возвращается <b>'+n+'</b> часов в неделю'
         + (n>=13 ? ' — почти два рабочих дня' : '');
     }));
   }},
  {k:'list', kicker:'давайте посчитаем математику', t:'ассистент',
   items:['залить рилс — 10 минут, пост в телеграм — 5, выдать материалы — 10, залить в сообщество — 10',
          '30 минут в день превращаются в 3 часа на неделе',
          'сюда добавляем поиск подрядчиков и переписку с ними — выходит 6 часов',
          'снова целый рабочий день']},

  {k:'sec', n:'шаг 8', t:'платный трафик'},
  {k:'st', t:'про платный трафик скажу честно:<br>я не эксперт по закупу', sm:true,
   sub:'я разбираюсь в контенте, а контент — это и есть бесплатный трафик'},
  {k:'st', t:'подключать, когда монетизация уже настроена', sm:true,
   sub:'иначе платный трафик просто быстрее покажет, что система не работает. дороже и обиднее'},

  {k:'sec', n:'осторожно', t:'антипаттерны<br>уровня'},
  {k:'list', kicker:'что вернёт вас назад', t:'',
   items:['«надо просто больше выкладывать» — прямая дорога на третий уровень',
          'лить сразу на все площадки — не раскачаете ни одной',
          'мыслить масштабом вместо действий — если контент перестал выходить, вы не масштабируетесь, а фантазируете',
          'ждать, что масштаб отменит откаты — не отменит']},

  {k:'sec', n:'итог', t:'задача уровня'},
  {k:'list', kicker:'делаем руками', t:'', numbered:true,
   items:['собрать файл со ссылками на свои лучшие единицы — минимум десять',
          'взять три из них и переупаковать в другую форму. ничего нового не придумывая',
          'выбрать ОДНУ новую площадку с органикой',
          'ответить, какой из двух путей роста ваш']},
  {k:'st', t:'маркер: вы перестали спрашивать<br>«что бы ещё создать»', sm:true,
   sub:'и начали спрашивать «что из того, что уже сработало, ещё не отработало на полную»', dark:true},
];
Deck.build(SLIDES);
</script>
