  .pillars{display:flex;gap:20px;justify-content:center;align-items:flex-end;max-width:1050px;margin:0 auto;}

  .pil:hover{border-color:var(--accent);}
  .pil.on{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-8px);}
  .pil .n{font-size:22px;color:var(--accent);font-weight:800;letter-spacing:.14em;text-transform:uppercase;}

  .pil .q{font-size:22px;color:var(--muted);line-height:1.35;}
  .pilout{margin-top:26px;border-top:2px solid var(--ink);padding-top:22px;text-align:left;min-height:190px;max-width:1050px;margin-left:auto;margin-right:auto;}
  .pilout .k{font-size:21px;color:var(--accent);text-transform:uppercase;letter-spacing:.14em;font-weight:800;margin-bottom:8px;}
  .pilout .p{font-size:25px;line-height:1.4;color:var(--muted);}
  .pilout .p b{color:var(--ink);}
  /* весы хочу/надо */
  .scale{max-width:900px;margin:0 auto;}
  .scale-bar{display:flex;height:64px;border:2px solid var(--ink);overflow:hidden;}
  .scale-bar .l{background:var(--accent);transition:.3s;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:26px;}
  .scale-bar .r{background:#14110f;transition:.3s;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:26px;}
  .scale-ctl{display:flex;gap:12px;justify-content:center;margin-top:22px;}
  .scale-out{margin-top:26px;font-size:28px;line-height:1.4;min-height:110px;}
  .scale-out b{color:var(--accent);}
  /* куда грузить */
  .where{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;max-width:1150px;margin:0 auto;}
  .where .w{border:2px solid var(--line);background:#fff;padding:24px 18px;text-align:left;}
  .where .w .f{font-size:26px;font-weight:800;}
  .where .w .p{font-size:23px;color:var(--accent);font-weight:700;margin-top:12px;line-height:1.35;}
