<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Новый уровень контента — оформление</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Шрифты грузятся НЕблокирующе: если Google Fonts недоступен или тормозит
     (мобильный интернет, оператор, отсутствие VPN) — страница оплаты всё равно
     рисуется системным шрифтом сразу, а не висит белой. -->
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Manrope:wght@400;500;600;700&subset=cyrillic,latin&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Manrope:wght@400;500;600;700&subset=cyrillic,latin&display=swap"></noscript>
<style>
:root {
  --c-bg:           oklch(0.97 0.006 75);
  --c-text:         oklch(0.16 0.015 55);
  --c-muted:        oklch(0.42 0.012 55);
  --c-accent:       oklch(0.60 0.19 52);
  --c-accent-light: oklch(0.92 0.04 52);
  --c-line:         oklch(0.89 0.008 75);
  --c-surface:      oklch(0.95 0.004 75);
  --font-display: 'Archivo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-body:    'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { overflow-x: hidden; }
body {
  background: var(--c-bg); color: var(--c-text);
  font-family: var(--font-body); line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh; min-height: 100svh;
  display: flex; align-items: center; justify-content: center;
  padding: 28px 20px;
}
.card { width: 100%; max-width: 460px; margin: 0 auto; text-align: center; }
.eyebrow {
  font-size: 12px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.09em; color: var(--c-muted); margin-bottom: 16px;
}
h1 {
  font-family: var(--font-display); font-weight: 900; letter-spacing: -0.03em;
  line-height: 1.05; font-size: clamp(30px, 8.5vw, 44px); margin-bottom: 12px;
  overflow-wrap: break-word;
}
.hl { background: var(--c-accent-light); padding: .02em .18em; margin: 0 -.1em; border-radius: 3px; }
.tierName { font-weight: 700; font-size: 15px; color: var(--c-accent); margin-bottom: 22px; }
.incl { list-style: none; text-align: left; max-width: 360px; margin: 0 auto 26px; display: grid; gap: 10px; }
.incl li { position: relative; padding-left: 30px; font-size: 15px; color: var(--c-text); font-weight: 500; }
.incl li::before {
  content: ""; position: absolute; left: 0; top: 2px; width: 20px; height: 20px;
  border-radius: 50%; background: var(--c-accent);
  -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='white' d='M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z'/></svg>") center/14px no-repeat;
          mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='white' d='M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z'/></svg>") center/14px no-repeat;
}
/* состав предыдущих тарифов: перечислен целиком, но приглушён */
.incl li.from {
  padding-left: 0; font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.08em; color: oklch(0.70 0.008 55); margin-top: 2px;
}
.incl li.from::before { display: none; }
.incl li.prev { color: oklch(0.62 0.010 55); font-weight: 400; }
.incl li.prev::before { background: oklch(0.82 0.02 52); }
.price-wrap { background: var(--c-surface); border: 1px solid var(--c-line); border-radius: 14px; padding: 22px 20px; margin-bottom: 18px; }
.price { font-family: var(--font-display); font-weight: 900; font-size: 40px; letter-spacing: -.02em; color: var(--c-text); }
.per { font-size: 13px; color: var(--c-muted); margin-top: 4px; }
.deadline { font-size: 13px; color: var(--c-muted); margin-top: 8px; }
.deadline b { color: var(--c-accent); }
.btn {
  display: block; width: 100%; border: none; cursor: pointer;
  background: var(--c-accent); color: oklch(1 0 0);
  font-family: var(--font-display); font-weight: 800; font-size: 18px;
  padding: 18px 24px; border-radius: 10px; transition: opacity .15s;
}
.btn:hover { opacity: .9; }
.btn:active { transform: translateY(1px); }
.tiers { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; }
.tiers button {
  flex: 1; max-width: 120px; cursor: pointer; font-family: var(--font-body); font-weight: 600;
  font-size: 13px; padding: 10px 6px; border-radius: 9px; border: 1px solid var(--c-line);
  background: #fff; color: var(--c-muted); transition: all .12s;
}
.tiers button.on { border-color: var(--c-accent); color: var(--c-accent); background: var(--c-accent-light); }
.more { display: inline-block; margin-top: 18px; color: var(--c-muted); font-size: 14px; text-decoration: none; }
.more:hover { color: var(--c-accent); }
.note { margin-top: 14px; font-size: 12.5px; color: var(--c-muted); }
</style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">Курс записан целиком · доступ сразу после оплаты</p>
    <h1>Новый уровень <span class="hl">контента</span></h1>

    <div class="tiers">
      <button data-tier="t1">Тариф 1</button>
      <button data-tier="t2">Тариф 2</button>
      <button data-tier="t3">Тариф 3</button>
    </div>

    <p class="tierName" id="tierName"></p>

    <ul class="incl" id="incl"></ul>

    <div class="price-wrap">
      <div class="price" id="price"></div>
      <p class="per" id="per"></p>
      <p class="deadline">курс записан целиком · доступ <b>сразу</b> после оплаты</p>
    </div>

    <button class="btn" id="pay">Оформить доступ</button>
    <a class="more" href="https://thesashatoyz.com/uroven" target="_blank" rel="noopener">о продукте подробнее →</a>
    <p class="note" id="hint"></p>
  </main>

<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }
  var uid = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.id : null;

  var FORM = 'https://thesashatoyz.payform.ru';
  var origin = window.location.origin;

  // incl = только то, что добавляет сам тариф. Состав предыдущих подставляется
  // при рендере списком (приглушённо), чтобы человек видел объём целиком.
  // Режим продаж по тарифу. Копия константы из src/lib/sales.ts: этот файл —
  // статика, импортировать неоткуда. Переключать только скриптом
  // GSD-BRAND/scripts/sales-mode.mjs, иначе две страницы разъедутся.
  var SALES = { t1: 'sale', t2: 'waitlist', t3: 'waitlist' };
  var WAITLIST_NOTE = { t1: '', t2: 'набор в сентябре, 20 мест', t3: '5 мест' };
  var BOT = 'https://t.me/testtoyzbot';
  // Лист ожидания ведёт на анкету: нужны телефон и инстаграм, одного
  // клика в боте мало. Копия ссылки из src/lib/sales.ts.
  var ANKETA = 'https://world.thesashatoyz.com/anketa/dwy';

  var ORDER = ['t1', 't2', 't3'];
  var TIERS = {
    t1: { name: 'Тариф 1 — делаешь сам', price: 5450, per: 'разово, доступ навсегда · в рассрочку от 227 ₽/мес',
      incl: ['6 уровней прохождения контента', 'видеоуроки + методички', 'доступ навсегда',
             'предобучение сразу: <b>«Продающий Контент»</b> — система создания контента, который привлекает клиентов',
             'предобучение сразу: <b>«Формула Вирусного Контента»</b> — пошаговый план написания и создания коротких роликов на миллионы просмотров'] },
    // У тарифа 2 подписка 2356023 (10 000 сразу и каждые 30 дней), а НЕ 2987944:
    // старая карточка выставляет 7 500 и на ней десять человек по прежней цене.
    // Тот же id стоит в src/app/pay/[tier]/route.ts — менять в обоих местах.
    t2: { name: 'Тариф 2 — сам + монетизация', price: 10000, per: 'в месяц', sub: '2356023',
      incl: ['чат с обратной связью', 'воркшопы по монетизации и воронкам', 'созвон раз в месяц группой'] },
    t3: { name: 'Тариф 3 — делаем вместе', price: 50000, per: 'в месяц', sub: '2989937',
      incl: ['первый созвон 1-1 со мной', '12 созвонов группой за 3 месяца'] }
  };

  function qsTier() {
    var m = /[?&]tier=(t[123])/.exec(window.location.search);
    return m ? m[1] : 't1';
  }
  var tier = qsTier();

  function render() {
    var t = TIERS[tier];
    document.getElementById('tierName').textContent = t.name;
    document.getElementById('price').innerHTML = t.price.toLocaleString('ru-RU') + '&nbsp;₽';
    document.getElementById('per').textContent = t.per;
    var idx = ORDER.indexOf(tier);
    var html = '';
    if (idx > 0) {
      html += '<li class="from">всё из тарифа ' + idx + '</li>';
      ORDER.slice(0, idx).forEach(function (prev) {
        TIERS[prev].incl.forEach(function (x) { html += '<li class="prev">' + x + '</li>'; });
      });
    }
    html += t.incl.map(function (x) { return '<li>' + x + '</li>'; }).join('');
    document.getElementById('incl').innerHTML = html;
    var btns = document.querySelectorAll('.tiers button');
    for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('on', btns[i].getAttribute('data-tier') === tier);

    // Набор на тариф закрыт: кнопка ведёт в лист ожидания, а не в оплату.
    var closed = SALES[tier] !== 'sale';
    document.getElementById('pay').textContent = closed ? 'Записаться в лист ожидания' : 'Оформить доступ';
    var dl = document.querySelector('.deadline');
    if (dl) dl.innerHTML = closed
      ? WAITLIST_NOTE[tier]
      : 'курс записан целиком · доступ <b>сразу</b> после оплаты';
  }

  var btns = document.querySelectorAll('.tiers button');
  for (var i = 0; i < btns.length; i++) {
    btns[i].addEventListener('click', function () { tier = this.getAttribute('data-tier'); render(); });
  }

  function payFields() {
    var t = TIERS[tier];
    var orderId = 'uroven_' + tier + '_' + uid;
    // Доступ привязан к Telegram (оплата из бота). Кабинет — только через Telegram.
    var paidContent = 'Оплата принята: «Новый уровень контента» (' + t.name + '). '
      + 'Доступ привязан к твоему Telegram — открой кабинет через бота @testtoyzbot. '
      + 'Внутри сразу весь курс и два воркшопа: «Продающий Контент» и «Формула Вирусного Контента».';
    var f = {
      'do': 'pay',
      'order_id': orderId,
      'paid_content': paidContent,
      'urlNotification': origin + '/api/prodamus-webhook',
      'urlSuccess': 'https://t.me/testtoyzbot'
    };
    if (t.sub) {
      // Подписка (рекуррент): сумма и период берутся из карточки подписки в Продамусе.
      f['subscription'] = t.sub;
    } else {
      // Разовый (Тариф 1): товар с ценой.
      f['products[0][name]'] = 'Новый уровень контента — ' + t.name;
      f['products[0][price]'] = t.price;
      f['products[0][quantity]'] = 1;
    }
    return f;
  }

  // GET-URL для Продамуса: ключи с литеральными [] (Продамус требует их дословно),
  // значения — encodeURIComponent. Так paid_content с кириллицей приходит читаемым.
  function buildPayUrl() {
    var fields = payFields();
    var parts = [];
    for (var k in fields) parts.push(k + '=' + encodeURIComponent(fields[k]));
    return FORM + '?' + parts.join('&');
  }

  // Ловим ПОПЫТКУ оплаты (даже если она потом сорвётся в WebView) — иначе
  // такие люди невидимы в аналитике. Fire-and-forget, платёж не блокирует.
  function trackCheckout(method) {
    try {
      var payload = JSON.stringify({
        event_type: 'checkout_open',
        user_id: uid || undefined,
        utm_source: 'uroven_' + tier,
        metadata: { tier: tier, order_id: 'uroven_' + tier + '_' + uid, method: method, page: 'checkout' }
      });
      if (navigator.sendBeacon) {
        if (navigator.sendBeacon('/api/track-event', new Blob([payload], { type: 'application/json' }))) return;
      }
      fetch('/api/track-event', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: payload, keepalive: true }).catch(function () {});
    } catch (e) {}
  }

  document.getElementById('pay').addEventListener('click', function () {
    // Тариф закрыт — вместо оплаты уводим на анкету листа ожидания.
    if (SALES[tier] !== 'sale') {
      trackCheckout('waitlist');
      var wl = ANKETA + '?kind=' + tier + '&from=checkout';
      // Это обычная веб-страница, openTelegramLink её не откроет.
      if (tg && tg.openLink) tg.openLink(wl);
      else window.location.href = wl;
      return;
    }
    if (!uid) {
      trackCheckout('bounce_bot');
      // Вне бота — уводим в бота, чтобы доступ привязался к Telegram
      if (tg && tg.openTelegramLink) tg.openTelegramLink('https://t.me/testtoyzbot?start=uroven_' + tier);
      else window.location.href = 'https://t.me/testtoyzbot?start=uroven_' + tier;
      return;
    }
    if (tg && tg.openLink) {
      // Внутри Telegram-мини-аппа top-level form.submit на внешний домен блокируется
      // Telegram WebView — оплата не открывается. Открываем Продамус официальным API.
      trackCheckout('tg_openlink');
      tg.openLink(buildPayUrl());
      return;
    }
    // Обычный браузер — POST-форма (paid_content с кириллицей приходит читаемым)
    trackCheckout('browser_form');
    var fields = payFields();
    var form = document.createElement('form');
    form.method = 'POST';
    form.action = FORM;
    form.acceptCharset = 'UTF-8';
    for (var k in fields) {
      var inp = document.createElement('input');
      inp.type = 'hidden';
      inp.name = k;
      inp.value = fields[k];
      form.appendChild(inp);
    }
    document.body.appendChild(form);
    form.submit();
  });

  if (!uid) {
    document.getElementById('hint').textContent = 'Открой этот экран через бота — так доступ привяжется к твоему Telegram.';
  }

  render();
})();
</script>
</body>
</html>
