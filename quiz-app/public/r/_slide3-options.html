<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Слайд 3 — замкнутый круг</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--char:#1f1c19;--cream:#f4ece0;--orange:#ff5c3a;--muted:rgba(244,236,224,.62);--disp:'Unbounded',sans-serif;--body:'Inter',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0e0c0b;font-family:var(--body);color:var(--cream);padding:30px 16px 60px}
.optlbl{font-family:var(--disp);font-weight:700;color:var(--orange);font-size:.9rem;text-align:center;margin-bottom:14px}
.card{width:100%;max-width:390px;aspect-ratio:9/17;margin:0 auto;background:var(--char);border-radius:26px;padding:32px 24px;display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.glow{position:absolute;width:300px;height:300px;border-radius:50%;background:var(--orange);filter:blur(85px);opacity:.18;top:46%;left:50%;transform:translate(-50%,-50%)}
.kick{font-family:var(--body);font-weight:600;font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);position:relative;z-index:2}
.bn{font-family:var(--disp);font-weight:900;font-size:2.1rem;letter-spacing:-.03em;margin:10px 0 0;position:relative;z-index:2}
.vis{flex:1;display:flex;align-items:center;justify-content:center;position:relative;z-index:2}

.loop{position:relative;width:300px;height:300px}
.loop svg{position:absolute;inset:0;width:100%;height:100%}
.lc{position:absolute;text-align:center;font-family:var(--body);font-weight:600;font-size:.82rem;line-height:1.2;width:130px;left:50%;transform:translateX(-50%)}
.lc.t{top:6px}
.lc.r{top:50%;left:auto;right:-6px;transform:translateY(-50%);width:96px;text-align:left}
.lc.b{bottom:4px}
.lc.l{top:50%;left:-6px;transform:translateY(-50%);width:96px;text-align:right}
.lc .n{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--orange);color:var(--char);font-family:var(--disp);font-weight:800;font-size:.72rem;margin-bottom:5px}
.center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;font-family:var(--disp);font-weight:800;font-size:.92rem;color:var(--orange);width:120px;line-height:1.15}
.cap{font-family:var(--body);font-size:1.02rem;line-height:1.45;text-align:center;position:relative;z-index:2;margin-top:6px}
.cap b{color:var(--orange)}
</style></head>
<body>
<div class="optlbl">Слайд 3 · замкнутый круг</div>
<div class="card"><div class="glow"></div>
  <div class="kick">блок · основной</div>
  <div class="bn">УГОЖДЕНИЕ</div>
  <div class="vis">
    <div class="loop">
      <svg viewBox="0 0 300 300" aria-hidden="true">
        <defs><marker id="ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#ff5c3a"/></marker></defs>
        <!-- four clockwise arcs between the 4 nodes -->
        <path d="M150,38 A112,112 0 0,1 262,150" fill="none" stroke="#ff5c3a" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)" opacity=".9"/>
        <path d="M262,150 A112,112 0 0,1 150,262" fill="none" stroke="#ff5c3a" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)" opacity=".9"/>
        <path d="M150,262 A112,112 0 0,1 38,150" fill="none" stroke="#ff5c3a" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)" opacity=".9"/>
        <path d="M38,150 A112,112 0 0,1 150,38" fill="none" stroke="#ff5c3a" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)" opacity=".9"/>
      </svg>
      <div class="lc t"><span class="n">1</span><br>стараюсь быть хорошим</div>
      <div class="lc r"><span class="n">2</span><br>отдаю ещё больше</div>
      <div class="lc b"><span class="n">3</span><br>«спасибо», а денег нет</div>
      <div class="lc l"><span class="n">4</span><br>значит надо ещё лучше</div>
      <div class="center">и так<br>по кругу</div>
    </div>
  </div>
  <p class="cap">чем сильнее стараешься — <b>тем туже затягивает.</b></p>
</div>
</body></html>
